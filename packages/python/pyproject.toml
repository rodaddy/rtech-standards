[project]
name = "rtech-obs"
version = "1.0.0"
description = "Reference implementation of the rTech observability contract v1.0.0"
requires-python = ">=3.13"
license = { text = "All rights reserved" }
dependencies = [
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtech_obs"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# D = pydocstyle: module D100, package D104, class/function D101-D103 are gate
# failures per the rTech coding standards.
select = ["E", "F", "I", "W", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through case names from the shared fixture.
"tests/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
